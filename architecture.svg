<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
  <title id="title">Product defect classifier architecture</title>
  <desc id="description">Dataset preparation and training flow, followed by a Dockerized FastAPI inference service.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#536477"/>
    </marker>
    <style>
      .bg { fill: #f5f7fa; }
      .title { font: 700 27px Arial, sans-serif; fill: #172b4d; }
      .section { font: 700 17px Arial, sans-serif; fill: #274060; }
      .label { font: 700 15px Arial, sans-serif; fill: #17324d; }
      .small { font: 13px Arial, sans-serif; fill: #3d5368; }
      .box { fill: #fff; stroke: #7890a8; stroke-width: 2; rx: 13; }
      .data { fill: #e8f2ff; stroke: #4c83bd; }
      .train { fill: #e8f7ef; stroke: #418b65; }
      .serve { fill: #fff3df; stroke: #c28a31; }
      .arrow { stroke: #536477; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="610"/>
  <text class="title" x="600" y="42" text-anchor="middle">Visual Defect Detection — Data, Training, and Inference</text>

  <text class="section" x="56" y="92">OFFLINE: DATA PREPARATION &amp; MODEL TRAINING</text>
  <rect class="box data" x="55" y="115" width="190" height="100"/>
  <text class="label" x="150" y="148" text-anchor="middle">Image archive + labels</text>
  <text class="small" x="150" y="174" text-anchor="middle">def_front / ok_front</text>
  <text class="small" x="150" y="194" text-anchor="middle">source of ground truth</text>

  <rect class="box data" x="300" y="115" width="205" height="100"/>
  <text class="label" x="402" y="148" text-anchor="middle">Prepare dataset</text>
  <text class="small" x="402" y="174" text-anchor="middle">hash deduplication</text>
  <text class="small" x="402" y="194" text-anchor="middle">stratified 70 / 15 / 15</text>
  <path class="arrow" d="M245 165 H292"/>

  <rect class="box data" x="565" y="115" width="220" height="100"/>
  <text class="label" x="675" y="148" text-anchor="middle">Shared preprocessing</text>
  <text class="small" x="675" y="174" text-anchor="middle">grayscale, blur, resize, normalize</text>
  <text class="small" x="675" y="194" text-anchor="middle">training-only augmentation</text>
  <path class="arrow" d="M505 165 H557"/>

  <rect class="box train" x="845" y="115" width="295" height="100"/>
  <text class="label" x="992" y="148" text-anchor="middle">ConvNeXt-Tiny transfer learning</text>
  <text class="small" x="992" y="174" text-anchor="middle">class-weighted loss, differential learning rates</text>
  <text class="small" x="992" y="194" text-anchor="middle">validation checkpoint + threshold selection</text>
  <path class="arrow" d="M785 165 H837"/>

  <rect class="box train" x="845" y="260" width="295" height="90"/>
  <text class="label" x="992" y="293" text-anchor="middle">Held-out test evaluation</text>
  <text class="small" x="992" y="319" text-anchor="middle">precision / recall / F1 / ROC-AUC</text>
  <text class="small" x="992" y="338" text-anchor="middle">confusion matrix + error examples</text>
  <path class="arrow" d="M992 215 V252"/>

  <text class="section" x="56" y="405">ONLINE: IMAGE INFERENCE SERVICE</text>
  <rect class="box serve" x="55" y="430" width="195" height="100"/>
  <text class="label" x="152" y="464" text-anchor="middle">Client / operator</text>
  <text class="small" x="152" y="490" text-anchor="middle">uploads image</text>
  <text class="small" x="152" y="510" text-anchor="middle">multipart image_file</text>

  <rect class="box serve" x="310" y="430" width="220" height="100"/>
  <text class="label" x="420" y="464" text-anchor="middle">Docker container</text>
  <text class="small" x="420" y="490" text-anchor="middle">Python + CPU PyTorch</text>
  <text class="small" x="420" y="510" text-anchor="middle">bundled trained checkpoint</text>
  <path class="arrow" d="M250 480 H302"/>

  <rect class="box serve" x="590" y="430" width="220" height="100"/>
  <text class="label" x="700" y="464" text-anchor="middle">FastAPI + Uvicorn</text>
  <text class="small" x="700" y="490" text-anchor="middle">POST /predict</text>
  <text class="small" x="700" y="510" text-anchor="middle">GET /health · GET /docs</text>
  <path class="arrow" d="M530 480 H582"/>

  <rect class="box train" x="870" y="430" width="270" height="100"/>
  <text class="label" x="1005" y="464" text-anchor="middle">Prediction response</text>
  <text class="small" x="1005" y="490" text-anchor="middle">Normal / Defective</text>
  <text class="small" x="1005" y="510" text-anchor="middle">confidence + class probabilities</text>
  <path class="arrow" d="M810 480 H862"/>

  <path class="arrow dash" d="M992 350 V390 H700 V422"/>
  <text class="small" x="846" y="382" text-anchor="middle">saved checkpoint + matching preprocessing</text>
  <text class="small" x="600" y="578" text-anchor="middle">Evaluation informs threshold and model selection; the test split is held out from training.</text>
</svg>
